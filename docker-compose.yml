services:
  postgres:
    image: postgres:16-alpine
    container_name: vdr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vdr_user
      POSTGRES_PASSWORD: vdr_password
      POSTGRES_DB: vdr_governance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdr_user -d vdr_governance"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: vdr-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=${MOCK_MODE:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - AZURE_DOC_INTEL_ENDPOINT=${AZURE_DOC_INTEL_ENDPOINT:-}
      - AZURE_DOC_INTEL_KEY=${AZURE_DOC_INTEL_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: vdr-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=vdr_user
      - DB_PASSWORD=vdr_password
      - DB_NAME=vdr_governance
      - AI_ENGINE_URL=http://ai-engine:8000
      - REVIEW_TOKEN_SECRET=vdr-governance-super-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

volumes:
  postgres_data:
