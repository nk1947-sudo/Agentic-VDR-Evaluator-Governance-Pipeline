name: CI - Agentic VDR Evaluator & Governance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-ai-engine:
    name: Python AI Engine & PII Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-engine/requirements.txt
          pip install pytest pytest-cov

      - name: Run AI Engine Unit Tests
        env:
          MOCK_MODE: "true"
        run: |
          pytest services/ai-engine/tests -v --cov=services/ai-engine

  go-orchestrator:
    name: Go Orchestrator & Governance Gate Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/orchestrator/go.sum

      - name: Run Go Unit Tests
        working-directory: services/orchestrator
        run: |
          go test -v -race ./...

  adversarial-governance-eval:
    name: Adversarial Test Suite (HITL Gate Validation)
    runs-on: ubuntu-latest
    needs: [python-ai-engine, go-orchestrator]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r services/ai-engine/requirements.txt
          pip install pytest httpx reportlab

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate Adversarial Synthetic CIMs
        run: |
          python scripts/seed_mock_data.py

      - name: Run Adversarial Evaluation Test Suite
        env:
          MOCK_MODE: "true"
        run: |
          pytest tests/adversarial/test_adversarial_pipeline.py -v -s
